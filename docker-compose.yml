# Локальная сборка и запуск. На хосте нужен только Docker.
#
# ПОРТЫ. На машине уже подняты: 8080, 8081, 8092, 8100 (nginx/apache соседних проектов),
# 5433/5435 (postgres), 6382 (redis), 9000-9001 (minio), 5175, 8027, 1027, 33060.
# Плюс зарезервированы соседними проектами: 8091, 8086, 8099, 5173, 5434, 5436.
# Поэтому здесь взяты свободные 8104 и 8105 — менять только сверившись с `docker ps`.

services:
  web:
    build: ./site
    container_name: krovlya-web
    ports:
      - "8104:80"
    restart: unless-stopped

  api:
    build: ./api
    container_name: krovlya-api
    ports:
      - "8105:8105"
    environment:
      # Пока не заданы — заявки просто копятся в базе и пишутся в лог контейнера
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./data/leads:/app/data       # заявки переживают пересборку контейнера
      - ./data/files:/app/files      # PDF лид-магнитов
    restart: unless-stopped
