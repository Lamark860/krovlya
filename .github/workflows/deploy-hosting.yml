# Выкатка на виртуальный хостинг reg.ru: сборка в Actions → заливка по FTPS.
#
# Почему не как раньше: на shared-хостинге нет root, значит нет Docker и нет Bun.
# Поэтому статику собираем здесь, на раннере, а на хостинг кладём только результат:
# готовый dist + один PHP-файл API. Разбор решения — в _local_docs/11_DEPLOY.md.
#
# Секреты: HOSTING_HOST, HOSTING_USER, HOSTING_PASSWORD, HOSTING_PATH.
# Переменные: PUBLIC_SITE_URL, PUBLIC_INDEXABLE, SITE_CHECK_URL (последняя необязательна).
name: Deploy to hosting

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-krovlya-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Собрать статику
        working-directory: site
        env:
          # Печётся в статику: canonical, OG, robots.txt. Домен кириллический —
          # в адресах он живёт в punycode, иначе canonical получается неоднозначным.
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://xn--18-mlcpochedr0a.xn--p1ai' }}
          PUBLIC_INDEXABLE: ${{ vars.PUBLIC_INDEXABLE || '0' }}
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Собрать релиз
        run: |
          set -e
          mkdir -p release
          cp -R site/dist/. release/
          cp deploy/htaccess release/.htaccess
          mkdir -p release/api
          cp api-php/index.php release/api/index.php
          echo "в релизе файлов: $(find release -type f | wc -l)"

      - name: Залить на хостинг
        env:
          HOST: ${{ secrets.HOSTING_HOST }}
          USER: ${{ secrets.HOSTING_USER }}
          PASSWORD: ${{ secrets.HOSTING_PASSWORD }}
          PATH_REMOTE: ${{ secrets.HOSTING_PATH }}
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          # lftp, а не rsync: rsync нужен на обоих концах, а на shared-хостинге
          # его наличие не гарантировано.
          #
          # FTP, а не SFTP: ключ деплоя на сервер так и не попал, а SSH там банится
          # по IP после нескольких попыток подряд — на этом выкатка через Actions
          # молча стояла с самого начала. Пароль открытым текстом при этом не уходит:
          # хостер отдаёт AUTH TLS, поэтому TLS обязателен и на управляющем канале,
          # и на канале данных. Проверку сертификата снимаем осознанно — он
          # самоподписанный и цепочку не проходит; шифрование канала это не отменяет.
          #
          # --delete чистит на сервере то, чего больше нет в релизе, иначе там копятся
          # старые хешированные бандлы. Два каталога трогать нельзя: в .well-known
          # лежит подтверждение Let's Encrypt (без него не продлится сертификат),
          # cgi-bin заводит панель. Конфиг заявок (config/krovlya.php) лежит выше
          # корня сайта и под mirror не попадает вовсе — так и задумано.
          #
          # Без пути заливать некуда, а mirror без него уедет в домашний каталог
          # и снесёт там всё --delete'ом. Лучше упасть.
          [ -n "$PATH_REMOTE" ] || { echo "не задан секрет HOSTING_PATH"; exit 1; }
          [ -n "$PASSWORD" ] || { echo "не задан секрет HOSTING_PASSWORD"; exit 1; }

          # Пароль отдаём внутрь скрипта, а не аргументом lftp: в аргументах он
          # виден в списке процессов раннера.
          lftp <<LFTP
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set ftp:passive-mode true
          set net:max-retries 3
          set net:timeout 20
          set mirror:parallel-transfer-count 4
          open -u "$USER","$PASSWORD" "ftp://$HOST"
          mirror -R --delete --verbose=1 --exclude '(^|/)\.well-known/' --exclude '(^|/)cgi-bin/' release/ $PATH_REMOTE
          bye
          LFTP

      - name: Проверить, что сайт отвечает
        if: ${{ vars.SITE_CHECK_URL != '' }}
        env:
          BASE: ${{ vars.SITE_CHECK_URL }}
        run: |
          set -e
          code() { curl -s -o /dev/null -w '%{http_code}' "$BASE$1"; }

          for i in $(seq 1 10); do
            [ "$(code /poly)" = "200" ] && { echo "страница отдаётся"; break; }
            [ "$i" = "10" ] && { echo "страница не отдаётся"; exit 1; }
            sleep 3
          done

          # Вся цепочка заявки: .htaccess → api/index.php → MySQL
          curl -sf "$BASE/api/health" | grep -q '"ok":true' || { echo "API не отвечает"; exit 1; }

          # 404 должен быть 404, а не 200: иначе поисковик считает мусорные адреса страницами.
          c=$(code /nonexistent)
          [ "$c" = "404" ] || { echo "несуществующий адрес отдал $c"; exit 1; }
          echo "проверки пройдены"
