server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Статика Astro: html не кэшируем, ассеты с хешем — надолго
    # =404 вместо /404.html: иначе несуществующий адрес отдаётся с кодом 200,
    # и поисковик считает его нормальной страницей.
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache";
    }

    # Формы бьют на тот же origin — так не нужен CORS и не мигает preflight
    location /api/ {
        proxy_pass http://api:8105;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(woff2|jpg|jpeg|png|webp|avif|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # Базовая защита. HSTS не ставим здесь — им займётся внешний прокси с сертификатом.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /404.html;
}
